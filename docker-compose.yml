version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: threat_intel_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: threat_intelligence
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: threat_intel_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=threat_intelligence
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongodb

volumes:
  mongo_data:
